version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: toolstore_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rootpassword}
      POSTGRES_DB: ${DB_NAME:-toolstore}
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready
      interval: 3s
      timeout: 3s
      retries: 5
    volumes:
    - postgres_data:/var/lib/postgresql/data
    ports:
    - 5432:5432
  backend:
    build:
      context: ./toolstore-backend
      dockerfile: Dockerfile
    container_name: toolstore_backend
    restart: always
    environment:
    - NODE_ENV=production
    - DB_HOST=postgres
    - DB_PORT=5432
    - DB_USERNAME=${DB_USERNAME:-root}
    - DB_PASSWORD=${DB_PASSWORD:-rootpassword}
    - DB_NAME=${DB_NAME:-toolstore}
    - DB_SYNCHRONIZE=false
    - DB_SSL=false
    - JWT_SECRET=${JWT_SECRET}
    - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
    - JWT_ACCESS_EXPIRES=15m
    - JWT_REFRESH_EXPIRES=7d
    - KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY}
    - FRONTEND_URL=https://abzargorgij.com
    - PORT=3000
    ports:
    - 3000:3000
    volumes:
    - ./uploads:/usr/src/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build:
      context: ./toolstore-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: toolstore_frontend
    restart: always
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./uploads:/usr/share/nginx/html/uploads
    depends_on:
    - backend
volumes:
  postgres_data: null
