services:
  db:
    image: postgres:15-alpine
    container_name: toolstore_db
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: toolstore
    ports:
      - '5432:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d toolstore"]
      interval: 2s
      timeout: 2s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./toolstore-backend
      dockerfile: Dockerfile
    container_name: toolstore_backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=toolstore
      - JWT_SECRET=toolstore_super_secret_key_2024
      - JWT_EXPIRES_IN=1h
      - JWT_REFRESH_SECRET=toolstore_refresh_secret_key_2024
      - JWT_REFRESH_EXPIRES_IN=7d
      - PORT=3000
      - DB_SYNCHRONIZE=true
      - FRONTEND_URL=http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    command: npm run start:dev
    volumes:
      - ./toolstore-backend/src:/usr/src/app/src
      - ./toolstore-backend/uploads:/usr/src/app/uploads

  frontend:
    build:
      context: ./toolstore-frontend
      dockerfile: Dockerfile
    container_name: toolstore_frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      - VITE_API_URL=http://localhost:3000/api
      - VITE_API_BASE_URL=http://localhost:3000/api
    depends_on:
      - backend
    volumes:
      - ./toolstore-frontend/src:/usr/src/app/src
      - ./toolstore-frontend/public:/usr/src/app/public

volumes:
  postgres_data:
